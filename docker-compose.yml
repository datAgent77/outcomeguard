# Local stack: Postgres + API + web + verification (worker, isolated runner, egress proxy)
# and the demo fixtures.   docker compose up --build
#
# Networks
#   egress  (internet)  : api, web, proxy, fixtures
#   data    (internal)  : db, api, worker
#   sandbox (internal)  : worker, runner, proxy   ← the runner's ONLY network
#
# The API reads secrets from ./.env (git-ignored). The verifier services never get the
# .env file: they receive only the variables they need (no PayPal credentials).
# Fixed egress IPs exist only so the dev-only VERIFIER_DEV_ALLOW can name the local
# fixtures and sink; hosted deployments use public HTTPS URLs and no allowlist.
name: outcomeguard

networks:
  egress:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true
  sandbox:
    internal: true

volumes:
  pgdata:
  evidence:

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: outcomeguard
      POSTGRES_PASSWORD: outcomeguard
      POSTGRES_DB: outcomeguard
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outcomeguard"]
      interval: 3s
      retries: 20

  api:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://outcomeguard:outcomeguard@db:5432/outcomeguard
      EVIDENCE_DIR: /evidence
    volumes: [evidence:/evidence]
    ports: ["8000:8000"]
    networks:
      data: {}
      egress: { ipv4_address: 172.30.0.20 }
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./apps/web
    environment:
      OUTCOMEGUARD_API_URL: http://api:8000
    ports: ["3000:3000"]
    networks: [egress]
    depends_on: [api]

  fixtures:
    build: { context: ./apps/api, dockerfile: Dockerfile.verifier }
    command: ["python", "/fixtures/serve.py", "--host", "0.0.0.0", "--port", "8020",
              "--sink-url", "http://172.30.0.20:8000/sinks/default"]
    volumes: ["./fixtures:/fixtures:ro"]
    ports: ["8020:8020"]
    networks:
      egress: { ipv4_address: 172.30.0.10 }

  proxy:
    build: { context: ./apps/api, dockerfile: Dockerfile.verifier }
    command: ["python", "-m", "outcomeguard.verification.proxy", "--listen", "0.0.0.0:3128"]
    environment:
      APP_ENV: development
      VERIFIER_DEV_ALLOW: "172.30.0.10:8020,172.30.0.20:8000"
    networks: [sandbox, egress]

  runner:
    build: { context: ./apps/api, dockerfile: Dockerfile.verifier }
    networks: [sandbox]

  worker:
    build: { context: ./apps/api, dockerfile: Dockerfile.verifier }
    command: ["python", "-m", "outcomeguard.verification.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://outcomeguard:outcomeguard@db:5432/outcomeguard
      SINK_SECRET: ${SINK_SECRET:?set SINK_SECRET in .env}
      SINK_BASE_URL: http://172.30.0.20:8000
      VERIFIER_PROXY_URL: http://proxy:3128
      VERIFIER_RUNNER_URL: http://runner:7000
      EVIDENCE_DIR: /evidence
      LIGHTHOUSE_BIN: /app/verifier-tools/node_modules/.bin/lighthouse
    volumes: [evidence:/evidence]
    networks: [data, sandbox]
    depends_on:
      db: { condition: service_healthy }
      runner: { condition: service_started }
      proxy: { condition: service_started }
